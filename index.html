<style>
/* Layout: two modes on one page. html.m = phone app (sticky search + filter pills on top, bottom tab bar, full-bleed map).
   html.d = desktop (tabs in header, two-column card grid). Highway-sign vernacular: Overpass is a Highway Gothic revival. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --ink: #17221f;
  --muted: #5b6a65;
  --line: #d9e0dd;
  --sign: #0f5c46;        /* highway-sign green */
  --sign-ink: #ffffff;
  --sign-soft: #e2efe9;
  --deal: #f2b630;        /* caution amber for discounts */
  --deal-ink: #2b2104;
  --star: #d98a00;
  --danger: #b3261e;
  --map-land: #eef1ee;
  --map-town: #c9d3cf;
  --map-road: #a9b4b0;
  --me: #2a7fff;
  --display: "Overpass", "Segoe UI", system-ui, sans-serif;
  --body: "Overpass", "Segoe UI", system-ui, sans-serif;
  --mono: "Overpass Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --nav-h: 62px;
  --hdr: 150px;           /* measured at runtime */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513; --surface: #17201d; --ink: #e6ece9; --muted: #98a8a2; --line: #2a3632;
    --sign: #2f9a76; --sign-ink: #04140e; --sign-soft: #1b322a;
    --deal: #f2b630; --deal-ink: #2b2104; --star: #f5b43a; --danger: #f2827a;
    --map-land: #141c19; --map-town: #2c3a35; --map-road: #4a5a54; --me: #5aa0ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513; --surface: #17201d; --ink: #e6ece9; --muted: #98a8a2; --line: #2a3632;
  --sign: #2f9a76; --sign-ink: #04140e; --sign-soft: #1b322a;
  --deal: #f2b630; --deal-ink: #2b2104; --star: #f5b43a; --danger: #f2827a;
  --map-land: #141c19; --map-town: #2c3a35; --map-road: #4a5a54; --me: #5aa0ff; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 1001; background: var(--sign); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--deal); outline-offset: 2px; }
a { color: var(--sign); }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1120px; margin: 0 auto; }

/* ---------- header ---------- */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 1000; background: var(--sign); color: var(--sign-ink); }
.bar { display: flex; align-items: center; gap: 10px; padding-block: 10px; min-width: 0; }
.shield { flex: none; width: 30px; height: 32px; }
.brand { min-width: 0; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1; white-space: nowrap; }
.brand small { display: block; font-size: 11px; font-weight: 600; opacity: .8; letter-spacing: .06em; text-transform: uppercase; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .spacer { flex: 1; }
.loc-btn { display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 46vw; border: 1px solid color-mix(in srgb, var(--sign-ink) 35%, transparent); background: color-mix(in srgb, var(--sign-ink) 12%, transparent); color: var(--sign-ink); border-radius: 999px; padding: 8px 12px; font-size: 13.5px; font-weight: 700; }
.loc-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.icon-btn { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--sign-ink) 35%, transparent); background: none; color: var(--sign-ink); }
.icon-btn svg { width: 20px; height: 20px; }
.search { position: relative; }
.search input { width: 100%; padding: 12px 40px 12px 42px; border-radius: 12px; border: 0; background: var(--surface); color: var(--ink); font-size: 16px; }
.search > svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 19px; height: 19px; color: var(--muted); pointer-events: none; }
.search .clear-q { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; border-radius: 8px; }
.pills { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 10px 12px; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); scroll-padding-inline: 16px; }
.pills::-webkit-scrollbar { display: none; }
.pill { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; background: color-mix(in srgb, var(--sign-ink) 14%, transparent); color: var(--sign-ink); border: 1px solid color-mix(in srgb, var(--sign-ink) 30%, transparent); white-space: nowrap; }
.pill.on { background: var(--surface); color: var(--sign); border-color: var(--surface); }
.pill svg { width: 13px; height: 13px; opacity: .8; }
.pill select { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; font-size: 16px; cursor: pointer; appearance: none; }
.pill.reset { background: none; border-style: dashed; }
.tabs { display: flex; gap: 2px; }
.tabs button { background: none; border: 0; color: var(--sign-ink); opacity: .75; padding: 9px 14px 11px; font-weight: 700; font-size: 14.5px; border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { opacity: 1; border-bottom-color: var(--deal); }
.count { font-family: var(--mono); font-size: 11px; opacity: .8; margin-left: 4px; }

/* ---------- bottom nav (mobile) ---------- */
.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1000; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.bottomnav button { height: var(--nav-h); border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
.bottomnav svg { width: 24px; height: 24px; }
.bottomnav button[aria-selected="true"] { color: var(--sign); }
.bottomnav button[aria-selected="true"]::before { content: ""; position: absolute; top: 0; left: 28%; right: 28%; height: 3px; border-radius: 0 0 3px 3px; background: var(--sign); }
.bottomnav .badge { position: absolute; top: 7px; left: calc(50% + 8px); background: var(--deal); color: var(--deal-ink); font-family: var(--mono); font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 0 5px; min-width: 18px; line-height: 17px; }

/* ---------- list ---------- */
.summary { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; color: var(--muted); font-size: 13.5px; padding-block: 12px 10px; flex-wrap: wrap; }
.summary b { color: var(--ink); font-family: var(--mono); }
.linkish { background: none; border: 0; padding: 0; color: var(--sign); font-weight: 700; font-size: 13.5px; }
.list { display: grid; gap: 12px; padding-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card-head { display: flex; gap: 12px; align-items: flex-start; }
.card-head .t { flex: 1; min-width: 0; display: grid; gap: 6px; }
.card h3 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 19px; line-height: 1.2; text-wrap: balance; }
.deal { justify-self: start; background: var(--deal); color: var(--deal-ink); font-family: var(--mono); font-weight: 700; font-size: 15px; border-radius: 7px; padding: 4px 9px; line-height: 1.25; }
.cat { font-size: 14.5px; color: var(--muted); }
.cat b { color: var(--sign); font-weight: 700; }
.fav { flex: none; border: 1px solid var(--line); background: var(--bg); color: var(--muted); width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px; }
.fav svg { width: 26px; height: 26px; }
.fav[aria-pressed="true"] { color: var(--star); border-color: color-mix(in srgb, var(--star) 45%, var(--line)); }
.where { display: flex; gap: 10px; align-items: baseline; font-size: 15px; min-width: 0; }
.where .addr { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.dist { flex: none; font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--sign); background: var(--sign-soft); border-radius: 7px; padding: 3px 8px; }
.approx { color: var(--muted); font-size: 12.5px; }
.actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 12px; min-height: 48px; padding: 8px 12px; font-size: 15px; font-weight: 700; text-decoration: none; text-align: center; }
.btn.primary { background: var(--sign); border-color: var(--sign); color: var(--sign-ink); }
.btn svg { width: 18px; height: 18px; flex: none; }
details.more summary { cursor: pointer; font-size: 14px; color: var(--muted); font-weight: 700; padding-block: 4px; }
details.more ul { margin: 8px 0 0; padding-left: 18px; font-size: 14.5px; display: grid; gap: 6px; }

<script>
(() => {
  const $ = s => document.querySelector(s);
  const $$ = s => document.querySelectorAll(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const title = s => String(s || '').replace(/\b[a-z]/g, c => c.toUpperCase());
  const root = document.documentElement;
  const isMobile = () => root.classList.contains('m');

  const ICON = {
    star: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
    starO: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>',
    nav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 11 21 3l-8 18-2-8z"/></svg>',
    web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
    locate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>',
    fit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>',
    phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg>',
    desktop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>',
  };

  // business types: each category belongs to one; anything unlisted counts as Services
  const TYPES = [
    ['Food', ['American', 'Burgers', 'Pizza', 'Italian', 'Bar & Grill', 'Diner', 'Bagels & Breakfast', 'Sandwiches & Subs', 'Deli & Market',
      'Chicken', 'BBQ', 'Fast Food', 'Mexican', 'Latin', 'Chinese', 'Japanese & Sushi', 'Thai', 'Indian', 'Mediterranean', 'Seafood',
      'Steakhouse', 'Salads & Healthy']],
    ['Sweets & Drinks', ['Bakery & Desserts', 'Ice Cream & Frozen', 'Coffee & Café', 'Smoothies & Bowls']],
    ['Shopping', ['Retail & Gifts', 'Florist']],
    ['Fun & Fitness', ['Entertainment', 'Kids & Family Fun', 'Fitness', 'Education & Lessons']],
    ['Services', ['Auto', 'Home Services', 'Beauty & Salon', 'Cleaners', 'Printing & Shipping', 'Health & Optical', 'Tech Repair',
      'Photography', 'Events & Services', 'Transportation']],
  ];
  const TYPE_OF = {};
  TYPES.forEach(([t, cats]) => cats.forEach(c => { TYPE_OF[c] = t; }));
  const typeOf = s => TYPE_OF[s.category] || 'Services';

  // ---------- state ----------
  const S = {
    stores: [], meta: {}, view: 'list',
    q: '', type: '', town: '', cat: '', sort: 'near', radius: 0,
    me: null,            // {lat, lng, label, source, at}
    favs: new Set(), visits: [],
    shown: 40,
  };

  // ---------- persistence: Claude db (private per-user) when available, plus a localStorage copy ----------
  const LS = {
    get(k, d) { try { const v = localStorage.getItem('r9:' + k); return v ? JSON.parse(v) : d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem('r9:' + k, JSON.stringify(v)); } catch {} },
  };
  let col = null, visitCol = null, syncNote = 'Favorites and visits are saved on this device';

  function loadLocal() {
    S.favs = new Set(LS.get('favs', []));
    S.visits = LS.get('visits', []);
    S.me = LS.get('me', null);
    const f = LS.get('filters', null);
    if (f) Object.assign(S, { type: f.type || '', town: f.town || '', cat: f.cat || '', sort: f.sort || 'near', radius: f.radius || 0 });
  }

  async function connectDb() {
    if (!window.claude?.use) return;
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) return;
      col = db.collection('data/users/' + uid);
      visitCol = db.doc('data/users/' + uid + '/visits').collection('log');
      const [favSnap, prefSnap, vSnap] = await Promise.all([col.doc('favorites').get(), col.doc('prefs').get(), visitCol.get()]);
      if (favSnap.exists) S.favs = new Set(favSnap.data().ids || []);
      else if (S.favs.size) col.doc('favorites').set({ ids: [...S.favs] }).catch(() => {});
      if (prefSnap.exists && prefSnap.data().me) S.me = prefSnap.data().me;
      else if (S.me) col.doc('prefs').set({ me: S.me }).catch(() => {});
      const remote = vSnap.docs.map(d => ({ ...d.data(), id: d.id }));
      const ids = new Set(remote.map(v => v.id));
      for (const v of S.visits) if (!ids.has(v.id)) { visitCol.doc(v.id).set(stripId(v)).catch(() => {}); remote.push(v); }
      S.visits = remote.sort((a, b) => b.at.localeCompare(a.at));
      LS.set('favs', [...S.favs]); LS.set('visits', S.visits); LS.set('me', S.me);
      syncNote = 'Favorites and visits are saved to your Claude account';
      if (S.view === 'map') renderHeader(); else renderAll();
    } catch (e) { console.warn('db unavailable', e); }
  }
  const stripId = ({ id, ...rest }) => rest;

  function saveFavs() {
    LS.set('favs', [...S.favs]);
    col?.doc('favorites').set({ ids: [...S.favs] }).catch(() => toast('Could not sync favorites. Saved on this device.'));
  }
  function saveMe() {
    LS.set('me', S.me);
    col?.doc('prefs').set({ me: S.me }).catch(() => {});
  }
  function saveFilters() { LS.set('filters', { type: S.type, town: S.town, cat: S.cat, sort: S.sort, radius: S.radius }); }

  // ---------- geo ----------
  function miles(a, b) {
    const t = Math.PI / 180, dLat = (b.lat - a.lat) * t, dLng = (b.lng - a.lng) * t;
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLng / 2) ** 2;
    return 7917.6 * Math.asin(Math.sqrt(h));
  }
  const fmtMi = d => d < 0.1 ? '<0.1 mi' : d < 10 ? d.toFixed(1) + ' mi' : Math.round(d) + ' mi';
  function nearest(store) {
    const locs = store.locations.filter(l => l.lat);
    if (!locs.length) return { loc: store.locations[0] || null, d: Infinity };
    if (!S.me) return { loc: locs[0], d: Infinity };
    let best = null, bd = Infinity;
    for (const l of locs) { const d = miles(S.me, l); if (d < bd) { bd = d; best = l; } }
    return { loc: best, d: bd };
  }
  function parseCoords(s) {
    // accepts "40.26, -74.27", "40.26 -74.27", or a maps link containing lat,lng
    const m = String(s).match(/(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)/);
    if (!m) return null;
    const lat = +m[1], lng = +m[2];
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat, lng };
  }
  const inFrame = () => { try { return window.self !== window.top; } catch { return true; } };
  function tryGps(timeout = 12000) {
    return new Promise((res, rej) => {
      if (!navigator.geolocation) return rej(new Error('This browser has no location service. Pick a town or paste coordinates instead.'));
      navigator.geolocation.getCurrentPosition(
        p => res({ lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) }),
        e => rej(new Error(e.code === 1
          ? (inFrame() ? 'Claude artifacts can’t use your phone’s location. Pick a town or paste coordinates instead.' : 'Location is off for this site. Allow it in your browser settings, or pick a town.')
          : 'Could not get a GPS fix. Try again, or pick a town.')),
        { enableHighAccuracy: true, timeout, maximumAge: 60000 });
    });
  }

  // towns: centroid of geocoded store locations per city
  let townCenters = {};
  function buildTowns() {
    const acc = {};
    const add = (name, l) => {
      const k = name.toLowerCase().trim();
      if (!k || /multiple|online|various/.test(k)) return;
      (acc[k] ||= { n: 0, lat: 0, lng: 0, label: title(k) });
      if (l?.lat && !l.approx) { acc[k].n++; acc[k].lat += l.lat; acc[k].lng += l.lng; }
    };
    for (const s of S.stores) {
      add(s.town, null);
      for (const l of s.locations) add(l.city || '', l);
    }
    for (const s of S.stores) for (const l of s.locations) {
      const k = (l.city || '').toLowerCase().trim();
      if (acc[k] && !acc[k].n && l.lat) { acc[k].n = 1; acc[k].lat = l.lat; acc[k].lng = l.lng; }
    }
    townCenters = {};
    for (const [k, v] of Object.entries(acc)) if (v.n) townCenters[k] = { lat: v.lat / v.n, lng: v.lng / v.n, label: v.label };
    return Object.keys(acc).sort();
  }

  // ---------- filtering ----------
  const pct = d => { const m = String(d).match(/(\d+(?:\.\d+)?)\s*%/); return m ? +m[1] : 0; };
  function storeTowns(s) {
    const t = new Set(s.locations.map(l => (l.city || '').toLowerCase()));
    if (s.town) t.add(s.town.toLowerCase());
    return t;
  }
  function filtered(onlyFavs) {
    const words = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const out = [];
    for (const s of S.stores) {
      if (onlyFavs && !S.favs.has(s.id)) continue;
      if (S.type && typeOf(s) !== S.type) continue;
      if (S.town && !storeTowns(s).has(S.town)) continue;
      if (S.cat && s.category !== S.cat) continue;
      if (words.length) {
        const hay = s._hay ||= [s.name, s.category, s.highlights, s.town, ...s.locations.map(l => l.address)].join(' ').toLowerCase();
        if (!words.every(w => hay.includes(w))) continue;
      }
      const n = nearest(s);
      if (S.radius && S.me && !(n.d <= S.radius)) continue;
      out.push({ s, ...n });
    }
    const nameCmp = (a, b) => a.s.name.localeCompare(b.s.name);
    if (S.sort === 'near' && S.me) out.sort((a, b) => a.d - b.d || nameCmp(a, b));
    else if (S.sort === 'deal') out.sort((a, b) => pct(b.s.discount) - pct(a.s.discount) || nameCmp(a, b));
    else out.sort(nameCmp);
    return out;
  }

  // ---------- render ----------
  function mapsUrl(loc, s) {
    const q = loc?.street ? `${s.name}, ${loc.address}` : loc?.lat ? `${loc.lat},${loc.lng}` : `${s.name} ${s.town} NJ`;
    return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  }
  const lastVisit = id => S.visits.find(v => v.storeId === id);

  function cardHtml({ s, loc, d }) {
    const fav = S.favs.has(s.id);
    const lv = lastVisit(s.id);
    const others = s.locations.length - 1;
    const offer = (s.offerDetails || []).filter(o => o.length < 220);
    return `<article class="card" data-id="${esc(s.id)}">
      <div class="card-head">
        <div class="t">
          <h3>${esc(s.name)}</h3>
          <div class="deal">${esc(s.discount)}</div>
          <div class="cat"><b>${esc(s.category || 'Other')}</b>${s.highlights ? ' · ' + esc(s.highlights) : ''}</div>
        </div>
        <button class="fav" data-act="fav" aria-pressed="${fav}" aria-label="${fav ? 'Remove from' : 'Add to'} favorites">${fav ? ICON.star : ICON.starO}</button>
      </div>
      <div class="where">
        <span class="addr">${loc ? esc(loc.address) : esc(title(s.town)) + ' <span class="approx">(no street address listed)</span>'}${loc?.approx ? ' <span class="approx">· town location only</span>' : ''}</span>
        ${isFinite(d) ? `<span class="dist">${fmtMi(d)}</span>` : ''}
      </div>
      <div class="actions">
        <a class="btn primary" href="${esc(mapsUrl(loc, s))}" target="_blank" rel="noopener">${ICON.nav}Directions</a>
        ${s.website ? `<a class="btn" href="${esc(s.website)}" target="_blank" rel="noopener">${ICON.web}Website</a>` : ''}
        <button class="btn" data-act="visit">${ICON.pin}Log visit</button>
      </div>
      <details class="more"><summary>${others > 0 ? `${others + 1} locations · ` : ''}Offer terms & details</summary><ul>
        ${offer.map(o => `<li>${esc(o)}</li>`).join('')}
        ${s.phone ? `<li>Phone: ${esc(s.phone)}</li>` : ''}
        ${others > 0 ? s.locations.map(l => `<li>${esc(l.address)}${S.me && l.lat ? ` · <b>${fmtMi(miles(S.me, l))}</b>` : ''} · <a href="${esc(mapsUrl(l, s))}" target="_blank" rel="noopener">directions</a></li>`).join('') : ''}
        <li><a href="${esc(s.url)}" target="_blank" rel="noopener">Restrictions on the Route 9 Card site</a></li>
      </ul></details>
      ${lv ? `<div class="visited">Last visit ${new Date(lv.at).toLocaleDateString()}</div>` : ''}
    </article>`;
  }

  function renderList() {
    const onlyFavs = S.view === 'fav';
    const rows = filtered(onlyFavs);
    const total = onlyFavs ? S.favs.size : S.stores.length;
    const parts = [];
    if (S.radius && S.me) parts.push(`within ${S.radius} mi`);
    if (S.town) parts.push('in ' + title(S.town));
    $('#summary').innerHTML = `<span><b>${rows.length}</b> of ${total} ${onlyFavs ? 'favorites' : 'stores'}${parts.length ? ' ' + parts.join(' ') : ''}</span>${!S.me ? '<button class="linkish" data-act="setloc">Set location for distances</button>' : ''}`;
    const list = $('#list');
    if (!rows.length) {
      list.innerHTML = onlyFavs && !S.favs.size
        ? `<div class="empty"><b>No favorites yet</b>Tap the star on any store to keep it here.</div>`
        : `<div class="empty"><b>No stores match</b>Try a wider distance, another town, or clear the filters.</div>`;
      return;
    }
    list.innerHTML = rows.slice(0, S.shown).map(cardHtml).join('') +
      (rows.length > S.shown ? `<button class="btn more-btn" id="moreBtn">Show more (${rows.length - S.shown} left)</button>` : '');
  }

  function renderVisits() {
    const byId = Object.fromEntries(S.stores.map(s => [s.id, s]));
    $('#visitSummary').innerHTML = S.visits.length ? `<b>${S.visits.length}</b> logged visits` : '';
    $('#visitList').innerHTML = S.visits.length ? S.visits.map(v => {
      const s = byId[v.storeId];
      return `<div class="visit" data-vid="${esc(v.id)}">
        <div class="vh"><b>${esc(s?.name || v.storeName || v.storeId)}</b><span class="mono">${new Date(v.at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</span></div>
        ${v.note ? `<div>${esc(v.note)}</div>` : ''}
        <div class="mono">${v.lat != null ? `GPS ${v.lat.toFixed(5)}, ${v.lng.toFixed(5)} · ${esc(v.source || '')}` : 'No coordinates'}${v.saved ? ` · saved $${esc(v.saved)}` : ''}</div>
        ${v.lat != null ? `<div class="actions"><a class="btn" href="https://www.google.com/maps/search/?api=1&query=${v.lat},${v.lng}" target="_blank" rel="noopener">${ICON.pin}View spot</a></div>` : ''}
        <button class="del" data-act="delvisit">Delete visit</button>
      </div>`;
    }).join('') : `<div class="empty"><b>No visits logged</b>Use “Log visit” on a store to record the date, GPS spot and what you saved.</div>`;
  }

  // category dropdown lists only the categories of the chosen type
  let catKey = null;
  function renderCatOptions() {
    if (catKey === S.type) return;
    catKey = S.type;
    const cats = [...new Set(S.stores.filter(s => !S.type || typeOf(s) === S.type).map(s => s.category || 'Other'))].sort();
    if (S.cat && !cats.includes(S.cat)) S.cat = '';
    $('#cat').innerHTML = `<option value="">${S.type ? 'All ' + esc(S.type) : 'All categories'}</option>` +
      cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  }

  function renderHeader() {
    $('#locLabel').textContent = S.me ? (S.me.label || 'My location') : 'Set location';
    $$('[data-count="fav"]').forEach(e => { e.textContent = S.favs.size || ''; e.hidden = !S.favs.size; });
    $$('[data-count="visits"]').forEach(e => { e.textContent = S.visits.length || ''; e.hidden = !S.visits.length; });
    if (S.stores.length) renderCatOptions();
    $('#type').value = S.type; $('#cat').value = S.cat; $('#town').value = S.town; $('#sort').value = S.sort;
    $('#radius').value = String(S.me ? S.radius : 0);
    // each pill shows its current choice and fills in when it narrows the list
    $$('#pills .pill[data-pill]').forEach(p => {
      const sel = p.querySelector('select');
      p.querySelector('.pv').textContent = (sel.options[sel.selectedIndex]?.text || '').replace(/ \(\d+\)$/, '');
      p.classList.toggle('on', p.dataset.pill !== 'sort' && !!sel.value && sel.value !== '0');
    });
    $('#clearBtn').hidden = !(S.q || S.type || S.town || S.cat || S.radius);
    $('#clearQ').hidden = !S.q;
    const lb = $('#layoutBtn'), label = isMobile() ? 'Switch to desktop layout' : 'Switch to mobile layout';
    lb.innerHTML = isMobile() ? ICON.desktop : ICON.phone;
    lb.setAttribute('aria-label', label); lb.title = label;
    $('#foot').innerHTML = `<div>${S.stores.length} stores · list as of ${esc(S.meta.listAsOf || '?')} · refreshed ${esc(S.meta.updated || '?')} · ${esc(syncNote)}. Discounts listed as TBD are left out.</div>
      <button class="btn" data-act="layout">${isMobile() ? ICON.desktop + 'Desktop layout' : ICON.phone + 'Mobile layout'}</button>`;
  }

  function renderAll() {
    renderHeader();
    const v = S.view;
    $('#filters').hidden = v === 'visits';
    $('#listView').hidden = !(v === 'list' || v === 'fav');
    $('#mapView').hidden = v !== 'map';
    $('#visitsView').hidden = v !== 'visits';
    $$('[role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
    measureHeader();
    if (v === 'list' || v === 'fav') renderList();
    if (v === 'visits') renderVisits();
    if (v === 'map') renderMap();
  }

  function measureHeader() {
    root.style.setProperty('--hdr', $('#top').offsetHeight + 'px');
    if (map) setTimeout(() => map.invalidateSize(), 30);
  }

  // ---------- map ----------
  let map = null, cluster = null, meLayer = null, markers = [], selected = null, needFit = true;
  const cssVar = n => getComputedStyle(root).getPropertyValue(n).trim();
  const LABEL_ZOOM = 14;

  async function ensureMap() {
    if (map || !window.L) return;
    // no tile layer here, so the zoom range must be set explicitly (the cluster plugin requires maxZoom)
    map = L.map('map', { attributionControl: false, zoomSnap: 0.5, minZoom: 8, maxZoom: 18 }).setView([40.3, -74.28], 11);
    map.zoomControl.setPosition('topright');
    meLayer = L.layerGroup().addTo(map);
    cluster = L.markerClusterGroup ? L.markerClusterGroup({
      maxClusterRadius: 44, disableClusteringAtZoom: 15, showCoverageOnHover: false, spiderfyOnMaxZoom: true,
      iconCreateFunction: c => { const n = c.getChildCount(), big = n > 20; return L.divIcon({ className: '', html: `<div class="cluster${big ? ' big' : ''}">${n}</div>`, iconSize: big ? [52, 52] : [44, 44] }); },
    }) : L.layerGroup();
    cluster.addTo(map);

    // our own buttons: go to my location, show all results
    const Ctl = L.Control.extend({
      options: { position: 'topright' },
      onAdd() {
        const d = L.DomUtil.create('div', 'map-ctl');
        d.innerHTML = `<button type="button" data-mapact="me" aria-label="Center on my location">${ICON.locate}</button><button type="button" data-mapact="fit" aria-label="Show all results">${ICON.fit}</button>`;
        L.DomEvent.disableClickPropagation(d);
        d.addEventListener('click', e => {
          const b = e.target.closest('[data-mapact]'); if (!b) return;
          if (b.dataset.mapact === 'me') { S.me ? map.setView([S.me.lat, S.me.lng], 14) : openLocation(); }
          else fitResults();
        });
        return d;
      },
    });
    new Ctl().addTo(map);

    const toggleLabels = () => map.getContainer().classList.toggle('show-labels', map.getZoom() >= LABEL_ZOOM);
    map.on('zoomend', toggleLabels); toggleLabels();
    // tapping empty map just closes the store card; it never moves your location
    map.on('click', () => closePeek());

    try {
      const [towns, roads] = await Promise.all([fetch('towns.geojson').then(r => r.json()), fetch('roads.geojson').then(r => r.json())]);
      L.geoJSON(towns, { interactive: false, style: { color: cssVar('--map-town'), weight: 1, fillColor: cssVar('--surface'), fillOpacity: .55 } }).addTo(map).bringToBack();
      L.geoJSON(roads, { interactive: false, style: f => ({ color: f.properties.r9 ? cssVar('--deal') : cssVar('--map-road'), weight: f.properties.r9 ? 5 : 2, opacity: .95 }) }).addTo(map);
      const labels = L.layerGroup();
      towns.features.forEach(f => {
        const c = L.geoJSON(f).getBounds().getCenter();
        L.marker(c, { interactive: false, keyboard: false, icon: L.divIcon({ className: 'town-label', html: esc(f.properties.n), iconSize: null }) }).addTo(labels);
      });
      const toggleTowns = () => (map.getZoom() >= 11 && map.getZoom() < LABEL_ZOOM) ? labels.addTo(map) : labels.remove();
      map.on('zoomend', toggleTowns); toggleTowns();
    } catch (e) { console.warn('basemap failed', e); }
  }

  // pins are fixed-size HTML icons, so they stay the same easy-to-tap size at every zoom level
  function pinIcon(s, l, sel) {
    return L.divIcon({
      className: `pin${S.favs.has(s.id) ? ' fav' : ''}${l.approx ? ' approx' : ''}${sel ? ' sel' : ''}`,
      html: `<span class="dot"></span><span class="lbl">${esc(s.name)}<i>${esc(s.discount)}</i></span>`,
      iconSize: [44, 44], iconAnchor: [22, 22],
    });
  }

  function fitResults() {
    if (S.me && S.radius) map.fitBounds(L.latLng(S.me.lat, S.me.lng).toBounds(S.radius * 2 * 1609.34), { padding: [24, 24] });
    else if (markers.length) map.fitBounds(L.latLngBounds(markers.map(m => m.getLatLng())), { padding: [30, 30], maxZoom: 15 });
  }

  function renderMap() {
    ensureMap().then(() => {
      if (!map) { $('#map').innerHTML = '<div class="empty"><b>Map could not load</b>The list view still works.</div>'; return; }
      setTimeout(() => map.invalidateSize(), 40);
      closePeek();
      cluster.clearLayers(); meLayer.clearLayers(); markers = [];
      for (const { s } of filtered(false)) for (const l of s.locations) {
        if (!l.lat) continue;
        const m = L.marker([l.lat, l.lng], { icon: pinIcon(s, l, false), title: s.name, riseOnHover: true });
        m.on('click', e => { L.DomEvent.stop(e); openPeek(s, l, m); });
        markers.push(m);
      }
      cluster.addLayers ? cluster.addLayers(markers) : markers.forEach(m => m.addTo(cluster));
      if (S.me) {
        L.marker([S.me.lat, S.me.lng], { interactive: false, keyboard: false, zIndexOffset: -500, icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [20, 20], iconAnchor: [10, 10] }) }).addTo(meLayer);
        if (S.radius) L.circle([S.me.lat, S.me.lng], { radius: S.radius * 1609.34, color: cssVar('--sign'), weight: 2, fillOpacity: .05, dashArray: '6 6', interactive: false }).addTo(meLayer);
      }
      const note = $('#mapNote');
      note.hidden = !!markers.length;
      note.textContent = markers.length ? '' : 'No stores match these filters.';
      if (needFit) {
        needFit = false;
        if (S.me && !S.radius) map.setView([S.me.lat, S.me.lng], 13);
        else fitResults();
      }
    });
  }

  function openPeek(s, l, marker) {
    if (selected?.marker && selected.marker !== marker) selected.marker.setIcon(pinIcon(selected.s, selected.l, false));
    selected = { s, l, marker };
    marker.setIcon(pinIcon(s, l, true));
    marker.setZIndexOffset(1000);
    const d = S.me ? miles(S.me, l) : Infinity;
    const peek = $('#peek');
    peek.innerHTML = `<button class="close" data-act="closepeek" aria-label="Close">×</button>` + cardHtml({ s, loc: l, d });
    peek.hidden = false;
    // keep the chosen pin visible above the card
    const pt = map.latLngToContainerPoint(marker.getLatLng());
    const h = map.getSize().y, cardTop = h - peek.offsetHeight - 12;
    if (pt.y > cardTop - 30) map.panBy([0, pt.y - cardTop / 2], { animate: true });
  }
  function closePeek() {
    if (selected?.marker) { selected.marker.setIcon(pinIcon(selected.s, selected.l, false)); selected.marker.setZIndexOffset(0); }
    selected = null;
    $('#peek').hidden = true;
  }

  // ---------- sheets ----------
  function sheet(html, onMount) {
    const host = $('#sheetRoot');
    host.innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    const scrim = host.firstElementChild;
    const close = () => { host.innerHTML = ''; document.removeEventListener('keydown', onKey); };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    scrim.addEventListener('click', e => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
    onMount(scrim.querySelector('.sheet'), close);
  }

  function setMe(me) {
    S.me = { ...me, at: new Date().toISOString() };
    S.sort = 'near';
    saveMe(); saveFilters(); S.shown = 40; needFit = true;
    renderAll();
  }

  function openLocation() {
    const towns = Object.entries(townCenters).sort((a, b) => a[1].label.localeCompare(b[1].label));
    sheet(`<h2>Where are you?</h2>
      <div class="grp"><button class="btn primary" id="gpsBtn" type="button">${ICON.locate}Use my GPS</button><div class="msg" id="gpsMsg"></div></div>
      <div class="grp"><label for="townIn">Pick a town</label><select id="townIn"><option value="">Choose a town…</option>${towns.map(([k, v]) => `<option value="${esc(k)}">${esc(v.label)}</option>`).join('')}</select></div>
      <div class="grp"><label for="coordIn">Or paste GPS coordinates</label><input id="coordIn" inputmode="decimal" placeholder="40.2601, -74.2740">
        <div class="fine">In Google or Apple Maps, press and hold where you are, then copy the numbers it shows.</div></div>
      <div class="end">${S.me ? '<button class="btn" id="clearMe" type="button">Forget location</button>' : '<button class="btn" data-close type="button">Cancel</button>'}<button class="btn primary" id="useCoord" type="button">Set location</button></div>`,
    (el, close) => {
      el.querySelector('#gpsBtn').onclick = async () => {
        const msg = el.querySelector('#gpsMsg'); msg.className = 'msg'; msg.textContent = 'Finding you…';
        try { const p = await tryGps(); setMe({ ...p, label: 'My GPS', source: 'gps' }); close(); toast('Location set from GPS'); }
        catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
      };
      el.querySelector('#useCoord').onclick = () => {
        const c = parseCoords(el.querySelector('#coordIn').value);
        const t = el.querySelector('#townIn').value;
        if (c) { setMe({ ...c, label: `${c.lat.toFixed(3)}, ${c.lng.toFixed(3)}`, source: 'pasted' }); close(); toast('Location set'); return; }
        if (t && townCenters[t]) { const tc = townCenters[t]; setMe({ lat: tc.lat, lng: tc.lng, label: tc.label, source: 'town' }); close(); toast('Location set to ' + tc.label); return; }
        const msg = el.querySelector('#gpsMsg'); msg.className = 'msg err'; msg.textContent = 'Pick a town, or enter coordinates like 40.26, -74.27.';
      };
      el.querySelector('#townIn').onchange = e => { if (e.target.value) el.querySelector('#useCoord').click(); };
      el.querySelector('#clearMe')?.addEventListener('click', () => { S.me = null; S.radius = 0; saveMe(); saveFilters(); needFit = true; close(); renderAll(); });
    });
  }

  function openVisit(store) {
    const now = new Date();
    const local = new Date(now - now.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
    const n = nearest(store);
    sheet(`<h2>Log visit · ${esc(store.name)}</h2>
      <div class="grp"><label for="vWhen">When</label><input id="vWhen" type="datetime-local" value="${local}"></div>
      <div class="grp"><label for="vCoord">GPS coordinates</label><input id="vCoord" inputmode="decimal" value="${n.loc?.lat ? `${n.loc.lat}, ${n.loc.lng}` : S.me ? `${S.me.lat}, ${S.me.lng}` : ''}">
        <div class="row2"><button class="btn" id="vGps" type="button">${ICON.locate}My GPS now</button>${S.me ? `<button class="btn" id="vMe" type="button">My set location</button>` : '<span></span>'}</div>
        <div class="msg fine" id="vMsg">${n.loc?.lat ? 'Filled in with the store’s location.' : ''}</div></div>
      <div class="row2">
        <div class="grp"><label for="vSaved">Saved ($)</label><input id="vSaved" inputmode="decimal" placeholder="4.50"></div>
        <div class="grp"><label for="vNote">Note</label><input id="vNote" placeholder="Optional"></div>
      </div>
      <div class="end"><button class="btn" data-close type="button">Cancel</button><button class="btn primary" id="vSave" type="button">Save visit</button></div>`,
    (el, close) => {
      let source = n.loc?.lat ? 'store address' : S.me ? 'my location' : '';
      const coord = el.querySelector('#vCoord'), msg = el.querySelector('#vMsg');
      coord.oninput = () => { source = 'entered'; };
      el.querySelector('#vGps').onclick = async () => {
        msg.className = 'msg'; msg.textContent = 'Finding you…';
        try { const p = await tryGps(); coord.value = `${p.lat}, ${p.lng}`; source = 'gps'; msg.textContent = `GPS fix, ±${p.acc} m.`; }
        catch (e) { msg.className = 'msg err'; msg.textContent = e.message; }
      };
      el.querySelector('#vMe')?.addEventListener('click', () => { coord.value = `${S.me.lat}, ${S.me.lng}`; source = 'my location'; msg.textContent = 'Using your set location.'; });
      el.querySelector('#vSave').onclick = () => {
        const c = coord.value.trim() ? parseCoords(coord.value) : null;
        if (coord.value.trim() && !c) { msg.className = 'msg err'; msg.textContent = 'Coordinates should look like 40.26, -74.27.'; return; }
        const when = el.querySelector('#vWhen').value;
        const v = {
          id: 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          storeId: store.id, storeName: store.name,
          at: when ? new Date(when).toISOString() : new Date().toISOString(),
          lat: c ? c.lat : null, lng: c ? c.lng : null, source: c ? source : '',
          saved: el.querySelector('#vSaved').value.trim().replace(/^\$/, ''),
          note: el.querySelector('#vNote').value.trim(),
        };
        S.visits.unshift(v); S.visits.sort((a, b) => b.at.localeCompare(a.at));
        LS.set('visits', S.visits);
        visitCol?.doc(v.id).set(stripId(v)).catch(() => toast('Could not sync visit. Saved on this device.'));
        close();
        if (S.view === 'map' && selected) { openPeek(selected.s, selected.l, selected.marker); renderHeader(); } else renderAll();
        toast('Visit logged');
      };
    });
  }

  let toastT;
  function toast(t) {
    clearTimeout(toastT);
    document.querySelector('.toast')?.remove();
    const d = document.createElement('div'); d.className = 'toast'; d.setAttribute('role', 'status'); d.textContent = t;
    document.body.appendChild(d); toastT = setTimeout(() => d.remove(), 2400);
  }

  // ---------- events ----------
  function setView(v) {
    if (S.view === v) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    S.view = v; S.shown = 40;
    if (v !== 'map') closePeek();
    try { history.replaceState(null, '', '#' + v); } catch {}
    renderAll(); window.scrollTo({ top: 0 });
  }
  function setLayout(l) {
    root.classList.remove('m', 'd'); root.classList.add(l);
    try { localStorage.setItem('r9:layout', l); } catch {}
    renderAll();
  }
  $$('[role="tab"]').forEach(b => b.onclick = () => setView(b.dataset.view));
  $('#locBtn').onclick = openLocation;
  $('#layoutBtn').onclick = () => setLayout(isMobile() ? 'd' : 'm');
  let qT;
  $('#q').oninput = e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value; S.shown = 40; needFit = true; renderAll(); }, 150); };
  $('#q').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
  $('#clearQ').onclick = () => { $('#q').value = ''; S.q = ''; needFit = true; renderAll(); };
  const onPick = (key, conv = v => v) => e => {
    S[key] = conv(e.target.value);
    if (key === 'radius' && S.radius && !S.me) { S.radius = 0; renderAll(); openLocation(); return; }
    S.shown = 40; needFit = true; saveFilters(); renderAll();
  };
  $('#type').onchange = onPick('type');
  $('#cat').onchange = onPick('cat');
  $('#town').onchange = onPick('town');
  $('#sort').onchange = onPick('sort');
  $('#radius').onchange = onPick('radius', Number);
  $('#clearBtn').onclick = () => { S.q = ''; $('#q').value = ''; S.type = ''; S.town = ''; S.cat = ''; S.radius = 0; needFit = true; saveFilters(); renderAll(); };
  document.addEventListener('click', e => {
    if (e.target.id === 'moreBtn') { S.shown += 40; renderList(); return; }
    const act = e.target.closest('[data-act]'); if (!act) return;
    const a = act.dataset.act;
    if (a === 'setloc') return openLocation();
    if (a === 'layout') return setLayout(isMobile() ? 'd' : 'm');
    if (a === 'closepeek') return closePeek();
    if (a === 'delvisit') {
      const id = act.closest('[data-vid]').dataset.vid;
      if (act.dataset.armed !== '1') { act.dataset.armed = '1'; act.textContent = 'Tap again to delete'; return; }
      S.visits = S.visits.filter(v => v.id !== id); LS.set('visits', S.visits);
      visitCol?.doc(id).delete().catch(() => {});
      renderAll(); return;
    }
    const id = act.closest('[data-id]')?.dataset.id;
    const s = S.stores.find(x => x.id === id); if (!s) return;
    if (a === 'fav') {
      S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id);
      saveFavs();
      // on the map, refresh only the open card and its pin so the map doesn't jump
      if (S.view === 'map' && selected) { openPeek(selected.s, selected.l, selected.marker); renderHeader(); }
      else renderAll();
      toast(S.favs.has(id) ? 'Added to favorites' : 'Removed from favorites');
    }
    if (a === 'visit') openVisit(s);
  });
  let rT;
  window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(measureHeader, 100); });

  // ---------- boot ----------
  async function boot() {
    loadLocal();
    const hv = location.hash.slice(1);
    if (['list', 'map', 'fav', 'visits'].includes(hv)) S.view = hv;
    renderHeader(); measureHeader();
    try {
      const data = await fetch('stores.json').then(r => r.json());
      S.stores = data.stores; S.meta = data;
      $('#asOf').textContent = `${data.count} businesses · list ${data.listAsOf}`;
    } catch (e) {
      $('#summary').textContent = 'Could not load the store list. Reload the page to try again.';
      return;
    }
    const towns = buildTowns();
    $('#town').insertAdjacentHTML('beforeend', towns.map(t => `<option value="${esc(t)}">${esc(title(t))}</option>`).join(''));
    const counts = {};
    S.stores.forEach(s => { counts[typeOf(s)] = (counts[typeOf(s)] || 0) + 1; });
    $('#type').insertAdjacentHTML('beforeend', TYPES.map(([t]) => t).filter(t => counts[t]).map(t => `<option value="${esc(t)}">${esc(t)} (${counts[t]})</option>`).join(''));
    if (S.type && !counts[S.type]) S.type = '';
    if (S.town && !towns.includes(S.town)) S.town = '';
    renderAll();
    connectDb();
  }
  boot();
})();
</script>
</body></html>
